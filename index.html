<html lang="zh-CN">

<title>教师个人成绩动态报告</title>
<style>
:root { --ink:#101827; --muted:#607086; --blue:#0b4e73; --cyan:#28d7ff; --line:#c7d9ea; --good:#12a36a; --bad:#d1453f; --warn:#c77912; --font:16px; }
* { box-sizing:border-box; }
body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; font-size:var(--font); color:var(--ink); background:

.login { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#06111f,#0b4e73 58%,#24305f); }
.login-card { width:min(430px,100%); background:rgba(248,251,255,.96); border:1px solid rgba(40,215,255,.24); border-radius:20px; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.28); }
.login-card h1 { margin:0 0 8px; font-size:1.45rem; }
.login-card input { width:100%; height:46px; margin:8px 0; border:1px solid var(--line); border-radius:12px; padding:0 12px; font-size:1rem; background:white; }
button { border:0; border-radius:999px; padding:10px 14px; background:linear-gradient(135deg,#0b4e73,#087ea4); color:white; font-weight:800; }
.error { color:var(--bad); min-height:24px; }
#report { display:none; }
header { position:relative; overflow:hidden; color:white; min-height:270px; padding:26px 18px 104px; background:
  radial-gradient(circle at 8% 8%, rgba(40,215,255,.28), transparent 28%),
  radial-gradient(circle at 78% 20%, rgba(124,92,255,.25), transparent 30%),
  linear-gradient(135deg,rgba(6,17,31,.98),rgba(11,78,115,.95) 55%,rgba(36,48,95,.92)),
  repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 22px); }
header:before { content:""; position:absolute; right:-88px; top:-112px; width:276px; height:276px; border-radius:50%; border:1px solid rgba(40,215,255,.30); box-shadow:0 0 0 38px rgba(255,255,255,.035), inset 0 0 42px rgba(40,215,255,.08); }
header:after { content:""; position:absolute; left:18px; bottom:68px; width:128px; height:4px; border-radius:999px; background:linear-gradient(90deg,#28d7ff,#8b5cf6,#f6c45f); box-shadow:0 0 18px rgba(40,215,255,.55); }
header h1 { position:relative; margin:0 0 10px; font-size:1.82rem; line-height:1.2; text-shadow:0 12px 28px rgba(0,0,0,.28); }
header p { position:relative; margin:0; color:rgba(255,255,255,.88); font-weight:700; }
.hero-chips { position:relative; display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.hero-chips span { border:1px solid rgba(40,215,255,.26); background:rgba(255,255,255,.12); color:white; border-radius:999px; padding:7px 11px; font-size:.86rem; backdrop-filter:blur(8px); }
.tools { position:fixed; left:12px; right:12px; bottom:12px; z-index:12; display:flex; justify-content:space-between; gap:8px; padding:8px; background:rgba(7,17,31,.88); backdrop-filter:blur(14px); border:1px solid rgba(40,215,255,.24); border-radius:999px; box-shadow:0 18px 45px rgba(2,8,23,.32); }
.tools div { display:flex; gap:8px; }
.tools button { background:rgba(40,215,255,.14); border:1px solid rgba(255,255,255,.18); }
main { margin-top:-58px; padding:0 10px 96px; max-width:780px; margin-left:auto; margin-right:auto; position:relative; z-index:2; }
section { background:rgba(248,251,255,.97); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 18px 42px rgba(15,23,42,.12); }
section h2 { margin-top:0; }
.metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.metric { border:1px solid rgba(40,215,255,.20); border-radius:14px; padding:12px; background:linear-gradient(180deg,#ffffff,#eef8ff); }
.metric b { display:block; font-size:1.35rem; color:var(--blue); }
.metric span,.hint { color:var(--muted); line-height:1.6; }
.card-grid { display:grid; gap:10px; }
.subject-card { border:1px solid var(--line); border-radius:14px; padding:12px; background:linear-gradient(180deg,#ffffff,#f4f9ff); }
.subject-card div { display:flex; justify-content:space-between; gap:12px; }
.subject-card.good span { color:var(--good); font-weight:800; }
.subject-card.bad span { color:var(--bad); font-weight:800; }
.spark { width:100%; height:54px; margin:6px 0; }
.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:separate; border-spacing:0; font-size:var(--font); }
th,td { white-space:nowrap; padding:9px 10px; border-bottom:1px solid #dfe8f2; text-align:left; }
th { background:#e7f6fb; color:#123f58; }
.good { color:var(--good); font-weight:800; } .bad { color:var(--bad); font-weight:800; } .warn { color:var(--warn); font-weight:800; }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
function fmt(value, digits=2) {
  if (value === null || value === undefined || value === '') return '—';
  if (typeof value === 'number') return value.toFixed(digits);
  return String(value);
}
function fmtByHeader(value, header) {
  if (value === null || value === undefined || value === '') return '—';
  if (typeof value !== 'number') return String(value);
  if (header.includes('年级') || header.includes('班级') || header.includes('名次') || header.includes('次数') || header.includes('数')) return String(Math.round(value));
  return value.toFixed(2);
}
function clsFor(text) {
  text = String(text || '');
  if (text.includes('进步') || text.includes('改善') || text.includes('提升')) return 'good';
  if (text.includes('退步') || text.includes('下滑') || text.includes('恶化') || text.includes('下降')) return 'bad';
  if (text.includes('警戒') || text.includes('新增') || text.includes('反复')) return 'warn';
  return '';
}
function table(headers, rows) {
  if (!rows.length) return '<p class="hint">暂无记录。</p>';
  return `<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${headers.map(h=>`<td class="${clsFor(row[h])}">${fmtByHeader(row[h], h)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function spark(values) {
  const valid = values.filter(v => typeof v === 'number');
  if (!valid.length) return '';
  let lo = Math.min(...valid), hi = Math.max(...valid);
  if (Math.abs(hi - lo) < 0.001) { lo -= 1; hi += 1; }
  const pts = values.map((v,i) => {
    const x = 8 + i * 52;
    const y = typeof v === 'number' ? 44 - ((v - lo) / (hi - lo)) * 34 : 26;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const color = values.at(-1) >= values[0] ? '#12a36b' : '#d1453f';
  return `<svg class="spark" viewBox="0 0 120 52"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="${color}" />`).join('')}</svg>`;
}
async function digest(text) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function render(name) {
  const record = DATA.teachers[name];
  const s = record.summary;
  document.getElementById('title').textContent = `${name}个人成绩动态报告`;
  const cards = record.assignments.map(row => `<article class="subject-card ${clsFor(row.动态判断)}"><div><b>${row.班级} · ${row.学科}</b><span>${row.动态判断}</span></div>${spark([row['2025-1期中_Z分'], row['2025-1期末_Z分'], row['2025-2期中_Z分']])}<p class="hint">${row.判断依据 || ''}</p></article>`).join('');
  document.getElementById('content').innerHTML = `
  <section><h2>教师总览</h2><div class="metric-grid">
    <div class="metric"><b>${s.任教组合数}</b><span>任教班级</span></div>
    <div class="metric"><b>${s.综合判断}</b><span>综合判断</span></div>
    <div class="metric"><b>${fmt(s.平均Z分变化)}</b><span>平均Z分变化</span></div>
    <div class="metric"><b>${fmt(s.平均均差变化)}</b><span>平均均差变化</span></div>
    <div class="metric"><b>${s.明显进步数}</b><span>明显进步数</span></div>
    <div class="metric"><b>${s.明显退步数}</b><span>明显退步数</span></div>
  </div><p class="hint">涉及年级：${s.涉及年级 || '—'}；平均名次变化：${fmt(s.平均名次变化)}</p></section>
  <section><h2>任教班级动态卡片</h2><div class="card-grid">${cards}</div></section>
  <section><h2>任教班级学科进退步明细</h2>${table(['年级','班级','学科','2025-1期中_Z分','2025-1期末_Z分','2025-2期中_Z分','Z分总变化','均差总变化','名次总变化','动态判断','判断依据'], record.assignments)}</section>
  <section><h2>重点变化</h2>${table(['年级','班级','学科','动态判断','Z分总变化','均差总变化','名次总变化','判断依据'], record.keyChanges)}</section>
  ${record.warnings.length ? `<section><h2>警戒与薄弱动态</h2>${table(['年级','班级','学科','出现次数','动态状态','Z分总变化','均差总变化','综合判断'], record.warnings)}</section>` : ''}
  ${record.helps.length ? `<section><h2>帮扶提升动态</h2>${table(['年级','班级','学科','名单期末均差','2025-2期中_均差','均差变化_期末到下期中','Z分变化_期末到下期中','帮扶后判断'], record.helps)}</section>` : ''}`;
}
document.getElementById('loginBtn').addEventListener('click', async () => {
  const user = document.getElementById('user').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  if (DATA.accounts[user] && await digest(pwd) === DATA.accounts[user]) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    render(user);
  } else {
    document.getElementById('error').textContent = '姓名或密码不正确';
  }
});
document.getElementById('logout').addEventListener('click', () => location.reload());
let fontSize = 16;
document.querySelectorAll('[data-font]').forEach(button => button.addEventListener('click', () => {
  fontSize = Math.min(22, Math.max(14, fontSize + Number(button.dataset.font)));
  document.documentElement.style.setProperty('--font', fontSize + 'px');
}));
</script>
</body>
</html>
