<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期中考试临界学生分析报告</title>
<link rel="icon" href="data:,">
<style>
:root{
--ink:#111827;--muted:#6b7280;--soft:#f5f5f7;--card:rgba(255,255,255,.78);--solid:#ffffff;
--border:rgba(17,24,39,.1);--accent:#2563eb;--accent-soft:#e8f0ff;--navy:#111827;
--green:#0f8f4d;--orange:#b45309;--red:#d92d20;--red-light:#fff1f0;--shadow:0 18px 50px rgba(17,24,39,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--soft);font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:1rem;color:var(--ink);background:radial-gradient(circle at 50% -10%,#fff 0,#f5f5f7 34%,#eceef2 100%);line-height:1.55;min-height:100vh;letter-spacing:0}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}

.login-wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(160deg,#fbfbfd 0%,#eef2f7 58%,#dde6f3 100%)}
.login-card{width:min(430px,100%);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.72);border-radius:28px;overflow:hidden;box-shadow:0 28px 80px rgba(15,23,42,.16);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.login-header{color:var(--ink);padding:34px 28px 20px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.34))}
.login-header h1{font-family:inherit;font-size:1.45rem;font-weight:750;letter-spacing:0;margin:0 0 8px}
.login-header p{color:var(--muted);font-size:.9rem;font-weight:400}
.login-tabs-wrap{padding:0 18px;position:relative;z-index:2}
.login-tabs{display:flex;padding:4px;background:rgba(17,24,39,.06);border-radius:14px;gap:4px}
.login-tab{flex:1;min-height:40px;padding:9px 8px;text-align:center;font-size:.867rem;font-weight:650;cursor:pointer;border:none;background:transparent;color:#6b7280;border-radius:11px;transition:background .18s,color .18s,box-shadow .18s}
.login-tab.active{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 6px 18px rgba(15,23,42,.08)}
.login-body{padding:22px 28px 30px}
.login-body input{width:100%;height:48px;margin:7px 0;border:1px solid rgba(17,24,39,.12);border-radius:14px;padding:0 14px;font-size:.95rem;background:rgba(255,255,255,.82);transition:border-color .18s,box-shadow .18s,background .18s;color:var(--ink)}
.login-body input:focus{outline:none;border-color:rgba(37,99,235,.58);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.login-body button{width:100%;height:48px;margin-top:13px;border:none;border-radius:14px;background:#111827;color:white;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}
.login-body button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(17,24,39,.18)}
.login-body button:active{transform:translateY(0);box-shadow:none}
.login-body button[disabled]{cursor:wait;opacity:.72;transform:none;box-shadow:none}
.login-error{color:var(--red);font-size:.84rem;min-height:20px;margin-top:8px}

#dashboard{display:none;position:relative;z-index:1}
.top-bar{color:var(--ink);padding:26px 20px 18px;position:relative;overflow:hidden;background:rgba(255,255,255,.58);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top-bar::after{display:none}
.top-bar h1{font-family:inherit;font-size:1.42rem;font-weight:780;position:relative;z-index:1;line-height:1.25;letter-spacing:0}
.top-bar .sub{position:relative;z-index:1;color:var(--muted);font-size:.88rem;font-weight:400;margin-top:6px}
.top-bar .tags{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.top-bar .tags span{border:1px solid rgba(17,24,39,.08);background:rgba(255,255,255,.72);border-radius:999px;padding:6px 11px;font-size:.78rem;color:#374151}
.toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(245,245,247,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);gap:10px}
.toolbar button{border:1px solid rgba(17,24,39,.1);background:rgba(255,255,255,.78);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:650;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.toolbar button:hover{background:#fff;border-color:rgba(17,24,39,.2);transform:translateY(-1px)}
main{max-width:920px;margin:0 auto;padding:16px 14px 76px}

.card{background:var(--card);border:1px solid rgba(255,255,255,.68);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card h2{font-family:inherit;font-size:1.04rem;font-weight:760;color:var(--ink);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(17,24,39,.08);display:flex;align-items:center;gap:8px;line-height:1.3}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:12px 0}
.metric-box{background:rgba(255,255,255,.74);border-radius:18px;padding:15px 12px;text-align:left;border:1px solid rgba(17,24,39,.08)}
.metric-box .num{font-size:1.6rem;font-weight:780;color:var(--ink);font-family:inherit;line-height:1.15}
.metric-box .label{font-size:.8rem;color:var(--muted);margin-top:6px}

.tier-card{background:rgba(255,255,255,.78);border-radius:20px;padding:0;margin:16px 0;box-shadow:0 10px 32px rgba(17,24,39,.07);border:1px solid rgba(17,24,39,.08);overflow:hidden}
.tier-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px}
.tier-header.qian20{background:#edf9f1;color:#126b3a;border-bottom:1px solid #cdebd8}
.tier-header.critical{background:#fff7e6;color:#8a4b05;border-bottom:1px solid #f5dfae}
.tier-header.hou20{background:#fff0ee;color:#a52318;border-bottom:1px solid #ffd0cb}
.tier-header h3{font-size:1rem;font-weight:750;margin:0;line-height:1.35}
.tier-header .meta{font-size:.8rem;opacity:.86;white-space:nowrap}
.tier-body{padding:14px 16px}

.subj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 16px 14px}
.subj-item{background:rgba(255,255,255,.78);border-radius:14px;padding:11px 8px;text-align:center;border:1px solid rgba(17,24,39,.08)}
.subj-item .name{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.subj-item .avg{font-size:1rem;font-weight:760;color:var(--ink)}
.subj-item .limit{font-size:.733rem;color:var(--red);margin-top:2px}

.tbl-wrap{background:#fff;border-radius:16px;overflow:auto;box-shadow:inset 0 0 0 1px rgba(17,24,39,.06);margin:12px 0;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:620px;border-collapse:separate;border-spacing:0;font-size:.867rem}
th{position:sticky;top:0;background:#f7f7f9;color:#374151;padding:11px 8px;text-align:center;font-weight:720;font-size:.8rem;letter-spacing:0;border-bottom:1px solid rgba(17,24,39,.08);z-index:2}
td{padding:10px 8px;text-align:center;border-bottom:1px solid rgba(17,24,39,.06);background:#fff}
tr:hover td{background:#fafafa}
td.bad{color:var(--red);font-weight:700}
td.good{color:var(--green);font-weight:700}
td.warn{color:var(--orange);font-weight:700}
td.sticky{position:sticky;left:0;background:#fff;font-weight:750;color:var(--ink);z-index:1;box-shadow:8px 0 18px rgba(255,255,255,.92)}
tr:hover td.sticky{background:#fafafa}
.weak-tag,.subj-tag{display:inline-flex;align-items:center;background:var(--red-light);color:var(--red);border-radius:999px;padding:3px 8px;font-size:.733rem;font-weight:700;margin:2px;border:1px solid rgba(217,45,32,.12)}

.zf-card{border:1px solid rgba(17,24,39,.08);border-radius:18px;padding:14px;margin:8px 0;background:rgba(255,255,255,.78)}
.zf-card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.zf-card .top b{font-size:.95rem}
.zf-card .top span{font-size:.8rem;font-weight:720;border-radius:999px;background:#f3f4f6;padding:3px 8px}
.zf-card .spark{width:100%;height:48px;margin:4px 0}
.zf-card .note{font-size:.78rem;color:var(--muted)}

.hint{color:var(--muted);font-size:.85rem;line-height:1.5}
.empty{text-align:center;padding:30px;color:var(--muted)}
.empty b{display:block;font-size:2rem;margin-bottom:8px}
@media(max-width:600px){
html{font-size:14px}
.login-wrap{padding:18px}
.login-card{border-radius:24px}
.login-header{padding:28px 22px 18px}
.login-header h1{font-size:1.28rem}
.login-tabs-wrap{padding:0 14px}
.login-tab{font-size:.857rem;padding:8px 4px}
.login-body{padding:18px 22px 24px}
.top-bar{padding:22px 16px 16px}
.top-bar h1{font-size:1.22rem}
main{padding:12px 10px 70px}
.card{border-radius:18px;padding:15px}
.card h2{font-size:1rem}
.metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.subj-grid{grid-template-columns:repeat(3,1fr);padding:0 12px 12px}
.tier-header{align-items:flex-start;flex-direction:column}
.tier-header .meta{white-space:normal}
table{min-width:700px}
}
</style>
</head>

function tbl(headers,rows){if(!rows.length)return'<p class="hint">暂无记录。</p>';return'<div class="tbl-wrap"><table><thead><tr>'+headers.map(function(h){return"<th>"+h+"</th>";}).join("")+"</tr></thead><tbody>"+rows.map(function(r){return"<tr>"+headers.map(function(h){return'<td class="'+(r[h]!==undefined?clsFor(r[h]):"")+'">'+fmtH(r[h],h)+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div>";}

function sha256Fallback(ascii){function rightRotate(v,a){return(v>>>a)|(v<<(32-a));}var mathPow=Math.pow,maxWord=mathPow(2,32),result="",words=[],asciiBitLength=ascii.length*8,hash=sha256Fallback.h=sha256Fallback.h||[],k=sha256Fallback.k=sha256Fallback.k||[],primeCounter=k.length,isComposite={};for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;}}ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";for(i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8;}words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=asciiBitLength;for(j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash.slice(0);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0),temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;hash.pop();}for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:"")+b.toString(16);}}return result;}
async function digest(t){if(window.crypto&&crypto.subtle&&window.TextEncoder){try{var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");}catch(e){}}return sha256Fallback(unescape(encodeURIComponent(t)));}
var loginRole="teacher";
function updateLoginUI(){

var html='<input id="userInput" autocomplete="username" placeholder="'+ph+'"'+(loginRole==="school"?' style="display:none" aria-hidden="true"':"")+'>';

async function doLogin(){

var u=(document.getElementById("userInput").value||"").replace(/\s+/g,"").trim();
var p=(document.getElementById("pwdInput").value||"").trim();

if(loginRole==="school"){
if(!p){err.textContent="请输入管理员密码";return;}

try{var sh=await digest(p);if(sh===D.school_account){document.getElementById("loginWrap").style.display="none";document.getElementById("dashboard").style.display="block";renderSchool();}else err.textContent="管理员密码不正确";}catch(e){err.textContent="登录组件初始化失败，请换浏览器或重新打开页面";}finally{btn.disabled=false;btn.textContent="进入总览";}
return;
}
if(!u){err.textContent="请输入"+(loginRole==="teacher"?"教师姓名":"班级号");return;}
if(!p){err.textContent="请输入密码";return;}
btn.disabled=true;btn.textContent="正在验证";
try{var h=await digest(p);
if(loginRole==="teacher"){
if(D.accounts[u]&&h===D.accounts[u]){document.getElementById("loginWrap").style.display="none";document.getElementById("dashboard").style.display="block";renderTeacher(u);}else err.textContent="姓名或密码不正确";
}else{

}
}catch(e){err.textContent="登录组件初始化失败，请换浏览器或重新打开页面";}finally{btn.disabled=false;btn.textContent=loginRole==="school"?"进入总览":"进入报告";}
}
